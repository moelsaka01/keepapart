name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-pc-windows-msvc,     os: windows-latest,   ext: zip }
          - { target: aarch64-pc-windows-msvc,    os: windows-latest,   ext: zip }
          - { target: x86_64-apple-darwin,        os: macos-latest,     ext: tar.gz }
          - { target: aarch64-apple-darwin,       os: macos-latest,     ext: tar.gz }
          - { target: x86_64-unknown-linux-musl,  os: ubuntu-latest,    ext: tar.gz }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, ext: tar.gz }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: package
        shell: bash
        run: |
          name=keepapart-${GITHUB_REF_NAME}-${{ matrix.target }}
          mkdir "$name"
          cp README.md LICENSE "$name"/
          if [[ "${{ matrix.ext }}" == zip ]]; then
            cp target/${{ matrix.target }}/release/keepapart.exe "$name"/
            7z a "$name.zip" "$name" >/dev/null
            sha256sum "$name.zip" > "$name.zip.sha256" 2>/dev/null || shasum -a 256 "$name.zip" > "$name.zip.sha256"
          else
            cp target/${{ matrix.target }}/release/keepapart "$name"/
            tar czf "$name.tar.gz" "$name"
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: keepapart-*.${{ matrix.ext }}*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: verify checksums
        working-directory: dist
        run: for f in *.sha256; do sha256sum -c "$f"; done
      - name: render Scoop / Homebrew / winget recipes with the real checksums
        run: python3 packaging/render.py "${GITHUB_REF_NAME}" dist dist/packaging
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/keepapart-*
            dist/packaging/*
          generate_release_notes: true

  crates-io:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ vars.PUBLISH_CRATE == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
